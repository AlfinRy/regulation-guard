version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend-node

  backend-node:
    build: ./backend-node
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BAND_SERVICE_URL=http://backend-band:8001
    depends_on:
      - backend-band

  backend-band:
    build: ./backend-band
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - BAND_API_KEY=${BAND_API_KEY:-}
      - BAND_BASE_URL=${BAND_BASE_URL:-https://platform.dev.band.ai}
